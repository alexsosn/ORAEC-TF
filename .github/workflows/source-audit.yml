name: Source audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/oraec_tf/audit.py"
      - "scripts/audit_source.py"
      - "tests/test_audit.py"
      - ".github/workflows/source-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ORAEC-TF
        run: python -m pip install -e '.[dev]'

      - name: Acquire pinned ORAEC source
        run: |
          mkdir -p upstream/corpus_raw_data
          git -C upstream/corpus_raw_data init
          git -C upstream/corpus_raw_data remote add origin https://github.com/oraec/corpus_raw_data.git
          git -C upstream/corpus_raw_data fetch --depth 1 origin b83a0ee5fae27a40d4c0a2a9a8c9c2973d45e9cd
          git -C upstream/corpus_raw_data checkout --detach FETCH_HEAD
          test "$(git -C upstream/corpus_raw_data rev-parse HEAD)" = "b83a0ee5fae27a40d4c0a2a9a8c9c2973d45e9cd"

      - name: Audit complete pinned source
        run: |
          python scripts/audit_source.py upstream/corpus_raw_data \
            --json reports/generated/source-audit.json \
            --markdown reports/generated/source-audit.md \
            --expected-revision b83a0ee5fae27a40d4c0a2a9a8c9c2973d45e9cd \
            --expected-text-files 13026

      - name: Show audit summary
        if: always()
        run: cat reports/generated/source-audit.md || true

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oraec-source-audit
          path: |
            reports/generated/source-audit.json
            reports/generated/source-audit.md
          if-no-files-found: error
