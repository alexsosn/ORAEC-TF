name: Stage and publish audited ORAEC software prerelease

on:
  pull_request:
    paths:
      - ".github/workflows/software-release.yml"
      - "scripts/verify_release_assets.py"
      - "scripts/audit_software_release.py"
      - "tests/test_release_asset_staging.py"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable ORAEC software version tag (v0.1.0rc1)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact source and existing immutable release tag
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
              echo "Release must be dispatched from main" >&2
              exit 1
            }
            [[ "$RELEASE_TAG" == "v0.1.0rc1" ]] || {
              echo "Only the reviewed RC version is supported" >&2
              exit 1
            }
            git fetch --tags origin main
            tagged="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            main_sha="$(git rev-parse origin/main)"
            [[ "$sha" == "$tagged" && "$sha" == "$main_sha" ]] || {
              echo "Tag, checked-out source and current main HEAD must match" >&2
              exit 1
            }
          fi
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [[ "$version" == "0.1.0rc1" ]] || {
            echo "Release source version differs from RC contract" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: RED/GREEN release code and built archive tests
        run: |
          python -m pip install -r requirements/tf-build.txt -e '.[dev]' 'build>=1,<2'
          python -m ruff check scripts/verify_release_assets.py tests/test_release_asset_staging.py
          python -m mypy
          python -m pytest -q tests/test_release_asset_staging.py tests/test_writer_wheel.py

      - name: Build actual ORAEC wheel and sdist, rebuild wheel from sdist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-dist" "$RUNNER_TEMP/rebuilt-wheel"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/release-dist" .
          python -m build --sdist --outdir "$RUNNER_TEMP/release-dist" .
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/rebuilt-wheel" \
            "$RUNNER_TEMP/release-dist/oraec_tf-0.1.0rc1.tar.gz"

      - name: Audit actual wheel, sdist and rebuilt software payload, emit SHA256 manifest
        shell: bash
        env:
          RELEASE_SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python scripts/verify_release_assets.py \
            --wheel "$RUNNER_TEMP/release-dist/oraec_tf-0.1.0rc1-py3-none-any.whl" \
            --sdist "$RUNNER_TEMP/release-dist/oraec_tf-0.1.0rc1.tar.gz" \
            --rebuilt-wheel "$RUNNER_TEMP/rebuilt-wheel/oraec_tf-0.1.0rc1-py3-none-any.whl" \
            --revision "$RELEASE_SOURCE" \
            --manifest "$RUNNER_TEMP/release-dist/release-manifest.json"
          python scripts/verify_release_assets.py \
            --verify-staged "$RUNNER_TEMP/release-dist" \
            --revision "$RELEASE_SOURCE" \
            --manifest "$RUNNER_TEMP/release-dist/release-manifest.json"

      - name: Upload audited software-only release staging files
        uses: actions/upload-artifact@v4
        with:
          name: oraec-software-only-release-stage
          path: |
            ${{ runner.temp }}/release-dist/oraec_tf-0.1.0rc1-py3-none-any.whl
            ${{ runner.temp }}/release-dist/oraec_tf-0.1.0rc1.tar.gz
            ${{ runner.temp }}/release-dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [stage]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: oraec-software-only-release-stage
          path: ${{ runner.temp }}/release-dist

      - name: Verify transferred software-only bytes and immutable tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ needs.stage.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == "v0.1.0rc1" && "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          git fetch --tags origin main
          tagged="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$tagged" == "$RELEASE_SOURCE" ]] || {
            echo "Release tag moved or source revision changed" >&2
            exit 1
          }
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SOURCE" ]] || {
            echo "Main HEAD moved since stage" >&2
            exit 1
          }
          local_tag="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          remote_tag="$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | awk 'NF {print $1}')"
          [[ -n "$remote_tag" && "$remote_tag" == "$local_tag" ]] || exit 1
          python scripts/verify_release_assets.py \
            --verify-staged "$RUNNER_TEMP/release-dist" \
            --manifest "$RUNNER_TEMP/release-dist/release-manifest.json" \
            --revision "$RELEASE_SOURCE"

      - name: Require all exact tagged source, browser, installed E2E and Agora acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ needs.stage.outputs.source_sha }}
        run: |
          set -euo pipefail
          for pair in \
            "ci.yml:push" \
            "writer-validation.yml:workflow_dispatch" \
            "release-rehearsal.yml:workflow_dispatch" \
            "agora-materializer.yml:workflow_dispatch"; do
            workflow="${pair%:*}"
            trigger="${pair#*:}"
            passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$RELEASE_SOURCE&event=$trigger&per_page=100" |
              jq --arg sha "$RELEASE_SOURCE" --arg trigger "$trigger" \
                '[.workflow_runs[] | select(.head_sha == $sha and .event == $trigger and .conclusion == "success" and .status == "completed")] | length')"
            [[ "$passed" =~ ^[0-9]+$ && "$passed" -ge 1 ]] || {
              echo "Missing successful exact tagged head acceptance: $workflow / $trigger" >&2
              exit 1
            }
          done

      - name: Publish exactly three software-only assets under existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ needs.stage.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-dist/oraec_tf-0.1.0rc1-py3-none-any.whl" \
            "$RUNNER_TEMP/release-dist/oraec_tf-0.1.0rc1.tar.gz" \
            "$RUNNER_TEMP/release-dist/release-manifest.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "ORAEC-TF $RELEASE_TAG (software only)" \
            --notes "Converter and standard Text-Fabric app only; no ORAEC source data, generated TF or corpus caches. Pinned source must be acquired separately. Source commit: $RELEASE_SOURCE. Verify SHA256 against release-manifest.json."
