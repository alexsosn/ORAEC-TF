name: lineCount research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/oraec_tf/linecount.py"
      - "scripts/analyze_linecount.py"
      - "tests/test_linecount.py"
      - ".github/workflows/linecount-research.yml"

# Supersede only same-event PR/ref runs; preserve independent manual dispatches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ORAEC-TF
        run: python -m pip install -e '.[dev]'

      - name: Acquire verified pinned ORAEC source
        run: |
          oraec-tf fetch upstream/corpus_raw_data
          oraec-tf verify-source upstream/corpus_raw_data

      - name: Analyse complete lineCount source
        run: |
          python scripts/analyze_linecount.py upstream/corpus_raw_data \
            --json reports/generated/linecount-analysis.json \
            --markdown reports/generated/linecount-analysis.md \
            --expected-tokens 815026 \
            --expected-with-linecount 789633

      - name: Show summary
        if: always()
        run: cat reports/generated/linecount-analysis.md || true

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oraec-linecount-analysis
          path: |
            reports/generated/linecount-analysis.json
            reports/generated/linecount-analysis.md
          if-no-files-found: error
