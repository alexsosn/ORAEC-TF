name: Installed wheelhouse distribution smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/**"
      - "scripts/smoke_installed_distribution.py"
      - "scripts/validate_wheelhouse_install.py"
      - ".github/workflows/installed-wheelhouse.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "scripts/smoke_installed_distribution.py"
      - "scripts/validate_wheelhouse_install.py"
      - "tests/test_installed_distribution_contract.py"
      - ".github/workflows/installed-wheelhouse.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-built-wheelhouse:
    # Both operating systems must build exact-source wheels online, then
    # install the acquired local wheels into a fresh environment offline.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Acquire and build exact-source runtime wheels ONLINE
        run: python -m pip wheel --wheel-dir "${{ runner.temp }}/wheelhouse" .
      - name: SHA256 lock and install wheelhouse OFFLINE without Git or resolver
        run: |
          python scripts/validate_wheelhouse_install.py --wheelhouse "${{ runner.temp }}/wheelhouse" --source-tree "${{ github.workspace }}" --manifest "${{ runner.temp }}/wheel-manifest.txt"
      - name: Upload checksum manifest only, not wheels or corpus
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oraec-local-wheelhouse-checksums-${{ matrix.os }}
          path: ${{ runner.temp }}/wheel-manifest.txt
          if-no-files-found: warn
