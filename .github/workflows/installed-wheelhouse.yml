name: Installed wheelhouse distribution smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "requirements/**"
      - "src/**"
      - "scripts/smoke_installed_distribution.py"
      - "scripts/validate_wheelhouse_install.py"
      - ".github/workflows/installed-wheelhouse.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements/**"
      - "src/**"
      - "scripts/smoke_installed_distribution.py"
      - "scripts/validate_wheelhouse_install.py"
      - "tests/test_installed_distribution_contract.py"
      - ".github/workflows/installed-wheelhouse.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  released-wheelhouse:
    # Resolve the checked-in runtime lock for each OS, using the actual
    # published tf-build wheel. Build only ORAEC from this checkout.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Acquire hash-verified published tf-build wheel ONLINE
        run: python -m pip download --no-deps --dest "${{ runner.temp }}/wheelhouse" -r requirements/tf-build.txt
      - name: Acquire locked platform runtime wheels ONLINE
        run: |
          python -m pip download --only-binary=:all: --require-hashes --find-links "${{ runner.temp }}/wheelhouse" --dest "${{ runner.temp }}/wheelhouse" -r requirements/runtime.lock
      - name: Build ORAEC software wheel only
        run: python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/wheelhouse" .
      - name: Resolve and install hash-locked wheelhouse OFFLINE without Git
        run: |
          python scripts/validate_wheelhouse_install.py --wheelhouse "${{ runner.temp }}/wheelhouse" --source-tree "${{ github.workspace }}" --manifest "${{ runner.temp }}/wheel-manifest.txt"
      - name: Upload checksum manifest only, not wheels or corpus
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oraec-local-wheelhouse-checksums-${{ matrix.os }}
          path: ${{ runner.temp }}/wheel-manifest.txt
          if-no-files-found: warn
