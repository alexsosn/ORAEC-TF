name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede only same-event PR/ref runs; preserve independent manual dispatches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements/tf-build.txt -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q

      # Disposable, branch-scoped research probe. This is never merged into main.
      - name: Research direct passage format navigation in real Chromium (#121)
        if: ${{ github.head_ref == 'research/browser-mode-121' && matrix.python-version == '3.12' }}
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
          python -c "from importlib.metadata import version; print('TF', version('text-fabric'))"
          pytest -q -s tests/test_advanced_app.py::test_real_browser_uses_attested_hieroglyphs_and_actual_dom
