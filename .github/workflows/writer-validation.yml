name: Native Text-Fabric writer source validation

on:
  workflow_dispatch:
  # Every non-draft PR head must run independent pinned-source validation,
  # regardless of which files changed. Draft runs skip the expensive job.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Draft pushes run cheap CI only; a ready-for-review event guarantees
    # the exact current head is validated before eligibility for merge.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements/tf-build.txt -e '.[dev]'

      - name: Fetch and verify immutable ORAEC source
        run: |
          oraec-tf fetch upstream/corpus_raw_data
          oraec-tf verify-source upstream/corpus_raw_data

      - name: Convert complete source and independently reload TF
        run: |
          mkdir -p reports/generated
          oraec-tf convert upstream/corpus_raw_data \
            --output reports/generated/tf \
            --upstream-commit b83a0ee5fae27a40d4c0a2a9a8c9c2973d45e9cd \
            --profile \
            > reports/generated/native-tf-validation.json

      - name: Check the immutable corpus totals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("reports/generated/native-tf-validation.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["counts"] == {
              "texts": 13026,
              "sentences": 101796,
              "tokens": 815026,
              "technical_anchors": 3,
              "slots": 815029,
          }, report
          print(report["counts"])
          PY

      - name: Independently audit raw source against generated TF
        run: |
          python scripts/validate_graph_source.py \
            upstream/corpus_raw_data reports/generated/tf \
            --source-revision b83a0ee5fae27a40d4c0a2a9a8c9c2973d45e9cd \
            --converter-revision "$(git rev-parse HEAD)" \
            --schema-version 3 \
            --report reports/generated/graph-conservation.json \
            --profile-report reports/generated/independent-audit-profile.json

      - name: Smoke local standard Text-Fabric advanced app and browser
        run: |
          python scripts/validate_advanced_app.py reports/generated/tf \
            > reports/generated/advanced-app-validation.json

      # Experimental branch-only native equivalence/performance proof.
      # Never runs on the production main audit or ordinary PRs.
      - name: Research native levUp versus candidate-superset on same pinned graph
        if: ${{ github.head_ref == 'perf/levup-equivalence-prototype-82' }}
        run: |
          python scripts/benchmark_levup_prototype.py reports/generated/tf \
            --report reports/generated/levup-benchmark.json

      # Feature-head E2E: verify opted-in data entirely on the hosted worker,
      # but upload ONLY provenance/counts, never the newly generated TF corpus.
      # Keeping this branch-scoped avoids doubling the full CI runtime on
      # unrelated PRs while providing full 13,026-text release evidence for #85.
      - name: E2E local Karnak opt-in conversion and independent corpus audit (#85)
        if: ${{ github.head_ref == 'feature/local-karnak-opt-in-85' }}
        run: |
          oraec-tf convert upstream/corpus_raw_data \
            --output reports/generated/local-karnak-tf \
            --upstream-commit b83a0ee5fae27a40d4c0a2a9a8c9c2973d45e9cd \
            --include-karnak > reports/generated/local-karnak-summary.json
          python scripts/validate_graph_source.py \
            upstream/corpus_raw_data reports/generated/local-karnak-tf \
            --source-revision b83a0ee5fae27a40d4c0a2a9a8c9c2973d45e9cd \
            --converter-revision "$(git rev-parse HEAD)" \
            --schema-version 3 --include-karnak \
            --report reports/generated/local-karnak-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tf.fabric import Fabric

          root = Path("reports/generated")
          summary = json.loads((root / "local-karnak-summary.json").read_text())
          assert summary["mapping_mode"] == "local-karnak-opt-in"
          assert summary["karnak_mapping_redistribution_terms"] == "unresolved"
          assert summary["counts"]["texts"] == 13026
          api = Fabric(locations=str(root / "local-karnak-tf"), silent="deep").loadAll(
              silent="deep"
          )
          per_file = {
              "mapping_oraec_karnak.tsv": 0,
              "mapping_oraec_lemmata_karnak.tsv": 0,
          }
          for source_node, targets in api.E.external.items():
              for _, filename in targets.items():
                  if filename in per_file:
                      per_file[filename] += 1
          assert per_file == {
              "mapping_oraec_karnak.tsv": 31,
              "mapping_oraec_lemmata_karnak.tsv": 1973,
          }, per_file
          print(per_file)
          PY

      - name: Upload counts and provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oraec-writer-conservation-counts
          path: |
            reports/generated/native-tf-validation.json
            reports/generated/graph-conservation.json
            reports/generated/independent-audit-profile.json
            reports/generated/advanced-app-validation.json
            reports/generated/levup-benchmark.json
            reports/generated/local-karnak-summary.json
            reports/generated/local-karnak-audit.json
          if-no-files-found: warn
